<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бюджет сім'ї Кісленко</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="container">

    <header>
        <div>
            <h1>💰 Бюджет сім'ї Кісленко</h1>
            <div class="small">
                Останнє оновлення:
                <span id="last-sync">—</span>
            </div>
        </div>
    </header>

    <!-- ========================= -->
    <!-- Загальний бюджет -->
    <!-- ========================= -->

    <section class="card budget-card">

        <h2>Загальний бюджет місяця</h2>

        <div class="budget-total">
            50 000 ₴
        </div>

        <div class="progress-bar">
            <div class="progress" id="totalProgress"></div>
        </div>

        <div class="budget-info">

            <div>
                <span>Витрачено</span>
                <strong id="totalSpent">
                    0 ₴
                </strong>
            </div>

            <div>
                <span>Залишилось</span>
                <strong id="moneyLeft">
                    50 000 ₴
                </strong>
            </div>

        </div>

    </section>

    <!-- ========================= -->
    <!-- Категорії -->
    <!-- ========================= -->

    <section style="margin-top:20px;">

        <div
            class="grid"
            id="categoriesGrid">
        </div>

    </section>

    <!-- ========================= -->
    <!-- Додавання витрати -->
    <!-- ========================= -->

    <section
        class="card"
        style="margin-top:20px;">

        <form id="expenseForm">

            <div class="row">

                <select
                    id="categorySelect"
                    required>

                    <option value="">
                        Оберіть категорію
                    </option>

                </select>

                <input
                    id="amountInput"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="Сума"
                    required>

                <button type="submit">
                    Додати
                </button>

            </div>

            <div
                class="select"
                style="margin-top:10px;">

                <input
                    id="noteInput"
                    type="text"
                    class="selectInput"
                    placeholder="Примітка (необов'язково)">

            </div>

        </form>

        <div class="history">

            <strong>
                Останні операції
            </strong>

            <div id="historyList"></div>

            <button
                id="showAllBtn"
                class="historyButton">

                Показати всю історію

            </button>

        </div>

    </section>

    <!-- ========================= -->
    <!-- Кнопка очистки -->
    <!-- ========================= -->

    <section class="footer-buttons">

        <button
            id="resetBtn"
            class="buttonReset">

            Скинути всі дані

        </button>

    </section>

</div>

<!-- ===================================================== -->
<!-- Popup категорії -->
<!-- ===================================================== -->

<div
    id="categoryModal"
    class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                Категорія
            </h2>

            <button
                id="closeModal"
                class="close-btn">

                ✕

            </button>

        </div>

        <div
            id="modalSummary"
            class="modal-summary">

        </div>

        <div
            id="modalHistory"
            class="modal-history">

        </div>

    </div>

</div>

<script src="./script.js"></script>

</body>
</html>
